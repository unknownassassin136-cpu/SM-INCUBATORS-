<div class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 border border-slate-100">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-blue-900 rounded-2xl flex items-center justify-center text-white font-black text-2xl mx-auto mb-4 shadow-lg">
        SM
      </div>
      <h1 class="text-2xl font-extrabold text-slate-900">Admin Control Center</h1>
      <p class="text-sm text-slate-500 mt-1">Sign in to manage SM Incubators website</p>
    </div>

    <!-- Error Alert -->
    <div *ngIf="errorMessage" class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm flex items-center gap-3">
      <svg class="w-5 h-5 flex-shrink-0 text-red-500" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
      </svg>
      <span>{{ errorMessage }}</span>
    </div>

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Admin Email</label>
        <div class="relative">
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            required
            placeholder="admin@smincubators.in"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-blue-900 focus:bg-white transition-all"
          />
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Password</label>
        <div class="relative">
          <input
            type="password"
            [(ngModel)]="password"
            name="password"
            required
            placeholder="••••••••••••"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-blue-900 focus:bg-white transition-all"
          />
        </div>
      </div>

      <button
        type="submit"
        [disabled]="loading"
        class="w-full py-3.5 px-4 bg-blue-900 hover:bg-blue-800 disabled:bg-slate-400 text-white font-bold rounded-xl shadow-lg transition-all flex items-center justify-center gap-2"
      >
        <span *ngIf="loading" class="animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></span>
        <span>{{ loading ? 'Signing In...' : 'Sign In to Dashboard' }}</span>
      </button>
    </form>

    <div class="mt-6 text-center">
      <a routerLink="/" class="text-xs text-slate-400 hover:text-slate-600 transition-colors">
        &larr; Back to main website
      </a>
    </div>
  </div>
</div>
